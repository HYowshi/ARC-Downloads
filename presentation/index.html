   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

(()=>{
const slides=JSON.parse(document.querySelector('#slide-data').textContent),deck=document.getElementById('deck'),toc=document.getElementById('toc');
for(const [i,s] of slides.entries()){
 const section=document.createElement('section');section.className='slide '+(s.kind||'')+(s.image?' has-image':'')+(s.phone?' phone':'');section.id='slide-'+(i+1);section.setAttribute('aria-label',`${i+1}. ${s.title}`);section.setAttribute('aria-roledescription','slide');
 if(s.image){const back=document.createElement('div');back.className='cinema-backdrop';back.style.backgroundImage=`url(\"${s.image}\")`;section.append(back)}const marker=document.createElement('div');marker.className='scene-marker';marker.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><i></i><span>${String(slides.length).padStart(2,'0')}</span>`;section.append(marker);const heading=document.createElement('div');heading.className='heading';const h=document.createElement(i===0?'h1':'h2');h.textContent=s.title;const sub=document.createElement('p');sub.className='subtitle';sub.textContent=s.subtitle;heading.append(h,sub);
 const p=document.createElement('p');p.className='copy';p.textContent=s.body;section.append(heading,p);
 if(s.image){const figure=document.createElement('figure'),img=document.createElement('img');img.src=s.image;img.alt=s.title+' trong ARC';img.loading=i===0?'eager':'lazy';img.decoding='async';figure.append(img);section.append(figure);}
 if(s.image&&s.kind!=='cover'&&s.kind!=='closing'){const caption=document.createElement('span');caption.className='caption';caption.textContent='Ảnh giao diện ARC thực tế · Dữ liệu minh họa · 30/10/2026';section.append(caption);}
 const arrow=document.createElement('button');arrow.className='film-arrow';arrow.type='button';arrow.setAttribute('aria-label','Cảnh tiếp theo');arrow.innerHTML='<span>TIẾP THEO</span><svg viewBox=\"0 0 88 28\" aria-hidden=\"true\"><path d=\"M1 14h78M66 2l13 12-13 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';arrow.onclick=()=>show(i+1);if(i<slides.length-1)section.append(arrow);deck.append(section);const button=document.createElement('button');button.type='button';button.textContent=String(i+1).padStart(2,'0')+'  '+s.title;button.onclick=()=>{toc.close();show(i)};document.getElementById('toc-list').append(button);
}
const pages=[...deck.children];let current=0;function show(i,update=true){const previous=current;current=Math.max(0,Math.min(slides.length-1,i));const direction=current>=previous?'forward':'backward';pages.forEach((p,n)=>{p.classList.remove('leaving-forward','leaving-backward','enter-forward','enter-backward');if(n===previous&&n!==current)p.classList.add('leaving-'+direction);p.classList.toggle('active',n===current);if(n===current)p.classList.add('enter-'+direction);p.inert=n!==current;p.setAttribute('aria-hidden',String(n!==current));if(n===current)p.scrollTop=0;});setTimeout(()=>pages.forEach(p=>p.classList.remove('leaving-forward','leaving-backward','enter-forward','enter-backward')),1250);document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('progress').style.width=(current+1)/slides.length*100+'%';if(update)history.replaceState(null,'','#'+(current+1));document.title=slides[current].title+' · ARC';}
function fromHash(){const n=Number(location.hash.slice(1));show(Number.isInteger(n)&&n>=1?n-1:0,false)}fromHash();addEventListener('hashchange',fromHash);
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('overview').onclick=()=>toc.showModal();document.getElementById('close-toc').onclick=()=>toc.close();
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('fullscreen').textContent='Dùng chế độ trình duyệt';}}document.getElementById('fullscreen').onclick=full;
addEventListener('keydown',e=>{if(toc.open||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key.toLowerCase()==='f')full();});
let start;deck.addEventListener('touchstart',e=>{start={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});deck.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>80&&Math.abs(dy)<60)show(current+(dx<0?1:-1));start=null},{passive:true});
})();

function fitStage(){const d=document.querySelector("#deck"),mobile=matchMedia("(max-width:760px)").matches;if(mobile){d.style.transform="none"}else{const s=Math.min(innerWidth/1920,innerHeight/1080);d.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}}addEventListener("resize",fitStage);fitStage();</script></body></html>
